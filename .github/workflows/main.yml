name: CI de Pruebas Automatizadas e Ingenieria del Caos

# 1. CUÁNDO SE EJECUTA: Cada vez que haces push a la rama main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. QUÉ VA A HACER EL SERVIDOR (PIPELINE)
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Usa un servidor Linux virtual gratuito de GitHub

    steps:
    # Paso A: Copiar el código del repositorio al servidor
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    # Paso B: Configurar el entorno (Node.js en este caso)
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-node: '20'

    # Paso C: Instalar dependencias si las hubiera (opcional)
    - name: Instalar dependencias
      run: npm install (o el comando de tu lenguaje, ej: composer install)

    # Paso D: INTEGRACIÓN DE PRUEBAS Y CAOS
    - name: Ejecutar Pruebas Automatizadas con Caos Simulado
      run: |
        echo "Iniciando suites de pruebas..."
        
        # --- Simulación de Ingeniería del Caos ---
        # Generamos un número aleatorio entre 1 y 10. 
        # Si sale 7, simulamos una caída de servidor (Falla aleatoria).
        NUMERO_ALEATORIO=$((1 + RANDOM % 10))
        echo "Verificando estabilidad del sistema... Código de estado: $NUMERO_ALEATORIO"
        
        if [ $NUMERO_ALEATORIO -eq 7 ]; then
          echo "🚨 INGENIERÍA DEL CAOS: Se detectó una latencia extrema en la BD. Prueba FALLIDA."
          exit 1
        else
          echo "✅ Todas las pruebas unitarias e integración pasaron con éxito."
          exit 0
        fi
